# Serves the dashboard and reverse-proxies /api to the ASP.NET Core service, so the
# browser talks to a single origin (no CORS needed). Streaming-friendly for SSE.

# Docker's embedded DNS; re-resolve "api" so an API container restart is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Coarse cap for everything, sized for document uploads (Rag__MaxFileBytes = 10 MB plus
  # multipart overhead). The API enforces the real per-endpoint limits itself: 256 KB for
  # JSON endpoints, 10 MB only for POST /api/documents.
  client_max_body_size 11m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events: forward each chunk immediately, allow long generations.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA entry point: always revalidate so new deployments are picked up.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
